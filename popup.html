<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WA Media Downloader</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <div class="glass-card">
    <div class="header">
      <span class="logo">📥</span>
      <div>
        <h1>Media Downloader</h1>
        <p class="sub">WhatsApp Web</p>
      </div>
    </div>

    <!-- Synchronized Live In-Page Selection Status Banner -->
    <div id="liveSelectionCard" class="live-card" style="display:none;" role="region" aria-label="WhatsApp in-page selection status">
      <div class="live-card-header">
        <span class="live-card-badge" data-i18n="popupLiveSelectionActive">🎯 In-Page Selection Active:</span>
        <span id="liveSelectionCount" class="live-card-count" aria-live="polite">0</span>
      </div>
      <div class="live-card-actions">
        <button class="btn btn-live-download" id="liveDownloadBtn" data-i18n="popupLiveDownloadBtn">📥 Download Selected Now</button>
        <button class="btn btn-live-clear" id="liveClearBtn" data-i18n="popupLiveClearBtn">Clear</button>
      </div>
    </div>

    <div class="tip">
      💡 Scroll up in the chat first to load older media.
    </div>

    <div class="stats" id="stats">
      <div class="stat-box">
        <span id="count">—</span>
        <label>Found</label>
      </div>
      <div class="stat-box">
        <span id="done">—</span>
        <label>Downloaded</label>
      </div>
    </div>

    <!-- Scope Selector: All Chat vs Visible Viewport -->
    <div class="scope-selector" role="group" aria-label="Selection scope">
      <button class="scope-btn active" id="scopeAll" data-scope="all" aria-pressed="true" data-i18n="scopeAll">💬 Entire Chat</button>
      <button class="scope-btn" id="scopeVisible" data-scope="visible" aria-pressed="false" data-i18n="scopeVisible">👁️ Current Screen</button>
    </div>

    <!-- Filter toggles — hidden until scan -->
    <div class="filters" id="filters" style="display:none;" role="group" aria-label="Media filters">
      <button class="filter-btn inactive" id="filter-docs" data-type="docs" aria-pressed="false">📄 Docs <span id="fdocs">0</span></button>
      <button class="filter-btn inactive" id="filter-images" data-type="images" aria-pressed="false">🖼️ Images <span id="fimages">0</span></button>
      <button class="filter-btn inactive" id="filter-videos" data-type="videos" aria-pressed="false">🎥 Videos <span id="fvideos">0</span></button>
      <button class="filter-btn inactive" id="filter-audio" data-type="audio" aria-pressed="false">🎵 Audio <span id="faudio">0</span></button>
    </div>

    <!-- Option: Export transcripts/captions -->
    <div class="option-row">
      <label class="option-label" for="includeTranscriptsCb">
        <input type="checkbox" id="includeTranscriptsCb" checked />
        <span data-i18n="optionTranscripts">📝 Download captions & transcripts (.txt)</span>
      </label>
    </div>

    <!-- Settings: Download Format (Single ZIP vs Individual Files) -->
    <fieldset class="settings-group" role="radiogroup" aria-labelledby="downloadModeLegend">
      <legend id="downloadModeLegend" class="settings-legend" data-i18n="settingDownloadModeTitle">📦 Download Format</legend>
      <div class="radio-options">
        <label class="radio-label" for="modeZip">
          <input type="radio" id="modeZip" name="downloadMode" value="zip" checked />
          <span data-i18n="settingDownloadModeZip">📦 Single .zip archive (Default)</span>
        </label>
        <label class="radio-label" for="modeIndividual">
          <input type="radio" id="modeIndividual" name="downloadMode" value="individual" />
          <span data-i18n="settingDownloadModeIndividual">📄 Individually download media</span>
        </label>
      </div>
    </fieldset>

    <p class="progress-label" id="progress-label" style="display:none;"></p>
    <div class="progress-bar" id="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Download progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <p class="status-text" id="status" role="status" aria-live="polite">Ready</p>

    <button class="btn" id="scanBtn" data-i18n="btnScan">Scan</button>
    <button class="btn btn-download" id="downloadBtn" style="display:none;" data-i18n="btnDownload">Download Selected</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;" data-i18n="btnCancel">✕ Cancel</button>
    <button class="btn btn-select-mode" id="toggleSelectBtn" data-i18n="btnSelectMode">🎯 WhatsApp Selection Mode (Shift + Click)</button>

    <div class="footer">
      <p>Free forever · <a href="https://ko-fi.com/renzluigi" target="_blank" rel="noopener noreferrer">Support on Ko-fi ☕</a></p>
      <p>If it saved you time, a small coffee means the world. 🙏</p>
    </div>

  </div>

  <script src="lib/zip-packager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
